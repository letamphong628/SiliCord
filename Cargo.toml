[package]
name = "silicord"
version = "0.1.0"
edition = "2021"
authors = ["SiliCord Contributors"]
description = "Clean-room, ultra-low RAM, 100% Native Rust Discord Desktop Client with direct Gateway/REST connection, Rust RPC Server, Global Keybinds, System Tray, and Telemetry Shield."
license = "MIT OR Apache-2.0"

[dependencies]
# 100% Native GPU-rendered UI (Zero Electron / Zero Chromium / Zero Web Bundle)
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"

# Async Runtime for Direct Discord Gateway (WSS), REST API (HTTPS), and IPC Named Pipes
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Direct HTTPS & WebSocket to Official Discord Servers (No middleman, OS-native TLS)
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "gzip"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
url = "2.5"

# Serialization & Protocol Encoding
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# Native Windows OS Integration (Global Hotkeys, System Tray, Memory Working-Set Trimmer)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
